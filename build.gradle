plugins {
    id 'java-library'
    id 'maven-publish'
    id 'com.google.cloud.artifactregistry.gradle-plugin' version '2.2.5' apply false
}

// The plugin looks for Google credentials as soon as it is applied, and fails a build that has none.
// So only a publish to the repository applies it; a build, a test run or publishToMavenLocal needs no credentials.
if (gradle.startParameter.taskNames.contains('publish')) {
    apply plugin: 'com.google.cloud.artifactregistry.gradle-plugin'
}

java {
    withSourcesJar()
    withJavadocJar()
}

group = 'com.myseotoolbox'
version = '4.0.10-SNAPSHOT'

base {
    archivesName.set(rootProject.name)
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

repositories {
    mavenCentral()
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-autoconfigure:4.0.1'
    annotationProcessor 'org.springframework.boot:spring-boot-configuration-processor:2.1.0.RELEASE'
    implementation 'com.google.cloud:spring-cloud-gcp-pubsub:7.4.1'
    implementation 'com.google.cloud:spring-cloud-gcp-starter-pubsub:7.4.1'
    implementation 'com.google.guava:guava:27.1-jre'
    implementation 'tools.jackson.core:jackson-databind:3.0.3'

    compileOnly 'org.projectlombok:lombok:1.18.42'
    annotationProcessor 'org.projectlombok:lombok:1.18.42'

    testImplementation 'org.junit.jupiter:junit-jupiter:5.12.2'
    testImplementation 'org.mockito:mockito-junit-jupiter:5.20.0'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

artifacts {
    archives jar, javadocJar, sourcesJar
}

tasks.named('test') {
    useJUnitPlatform()
}

tasks.named('jar') {
    manifest {
        attributes('Implementation-Title': project.name,
                'Implementation-Version': project.version)
    }
}


publishing {
    publications {
        mavenJava(MavenPublication) {
            from components.java
            versionMapping {
                usage('java-api') {
                    fromResolutionOf('runtimeClasspath')
                }
                usage('java-runtime') {
                    fromResolutionResult()
                }
            }
            pom {
                name = 'GCP Commons - by My SEO Toolbox'
                description = 'A library to abstract GCP Common libraries'
                url = 'https://github.com/salvatorenovelli/gcp-commons'

                developers {
                    developer {
                        id = 'snovelli'
                        name = 'Salvatore'
                    }
                }
                scm {
                    connection = 'scm:git:git:github.com:salvatorenovelli/gcp-commons.git'
                    developerConnection = 'scm:git:git:github.com:salvatorenovelli/gcp-commons.git'
                    url = 'https://github.com/salvatorenovelli/gcp-commons'
                }
                licenses {
                    license {
                        name = 'The Apache License, Version 2.0'
                        url = 'http://www.apache.org/licenses/LICENSE-2.0.txt'
                    }
                }
            }
        }
    }

    repositories {
        maven {
            url = "artifactregistry://europe-west2-maven.pkg.dev/my-seo-buddy/myseotoolbox-maven"
        }
    }
}